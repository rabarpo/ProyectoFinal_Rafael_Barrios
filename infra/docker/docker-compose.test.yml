name: seei-test

# Compose de test efímero para los e2e del backend (ver design.md, sección "Estrategia de
# testing" — "Postgres y Redis efímeros para los e2e del backend"). Levanta únicamente
# postgres y redis, en puertos alternos para no chocar con una instancia de desarrollo, con los
# datos en tmpfs para que nunca persistan entre corridas.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: seei
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SEEI_MIGRATOR_PASSWORD: ${SEEI_MIGRATOR_PASSWORD:?SEEI_MIGRATOR_PASSWORD is required}
      SEEI_APP_PASSWORD: ${SEEI_APP_PASSWORD:?SEEI_APP_PASSWORD is required}
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seei"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
